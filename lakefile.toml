name = "lean-db"
version = "0.1.0"
defaultTargets = ["LeanDB", "ldb"]
testDriver = "Tests"
license = "MIT"

[[lean_lib]]
name = "LeanDB"

[[lean_exe]]
name = "ldb"
root = "Main"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[require]]
name = "lean-fmt"
git = "https://github.com/jcreinhold/lean-fmt"
rev = "v4.34.0-rc2"

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "v4.34.0"
